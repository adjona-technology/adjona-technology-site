<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- White background -->
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- MS four squares, 2x2 grid, centred, with 2px gap -->
  <!-- Top-left: Red -->
  <rect x="4"  y="4"  width="11" height="11" fill="#F25022"/>
  <!-- Top-right: Blue -->
  <rect x="17" y="4"  width="11" height="11" fill="#0078D4"/>
  <!-- Bottom-left: Green -->
  <rect x="4"  y="17" width="11" height="11" fill="#7FBA00"/>
  <!-- Bottom-right: Yellow -->
  <rect x="17" y="17" width="11" height="11" fill="#FFB900"/>
</svg>
