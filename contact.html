<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Larry Osei-Kwaku · Adjona Technology</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #0F4C81;
    --red: #D83B01;
    --green: #2F6B00;
    --yellow: #F2A900;
    --dark: #0a0a0a;
    --light: #f5f4f0;
  }

  html, body {
    min-height: 100vh;
    background: var(--blue);
    font-family: 'DM Sans', sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  .bg-pattern {
    position: fixed;
    inset: 0;
    background: var(--blue);
    z-index: 0;
  }

  .bg-pattern::before {
    content: '';
    position: absolute;
    bottom: -100px;
    right: -100px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
  }

  .bg-pattern::after {
    content: '';
    position: absolute;
    top: -50px;
    left: -50px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,0.02);
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 36px 32px;
    backdrop-filter: blur(10px);
    animation: fadeUp 0.6s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }

  .bars {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 32px;
  }

  .bar {
    border-radius: 3px 3px 0 0;
    animation: barGrow 0.8s ease both;
  }

  .bar:nth-child(1) { width: 7px; height: 17px; background: var(--blue); border: 2px solid rgba(255,255,255,0.5); animation-delay: 0.1s; }
  .bar:nth-child(2) { width: 7px; height: 21px; background: var(--red); animation-delay: 0.2s; }
  .bar:nth-child(3) { width: 7px; height: 26px; background: var(--green); animation-delay: 0.3s; }
  .bar:nth-child(4) { width: 7px; height: 32px; background: var(--yellow); animation-delay: 0.4s; }

  @keyframes barGrow {
    from { transform: scaleY(0); transform-origin: bottom; }
    to { transform: scaleY(1); transform-origin: bottom; }
  }

  .wordmark { line-height: 1; }
  .wordmark-main { font-size: 17px; font-weight: 600; letter-spacing: 0.06em; color: #fff; }
  .wordmark-sub { font-size: 10px; font-weight: 400; letter-spacing: 0.14em; color: rgba(255,255,255,0.6); text-transform: uppercase; }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 0 0 28px;
  }

  .name {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 6px;
    color: #fff;
  }

  .role {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .details {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 32px;
  }

  .detail-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
  }

  .detail-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 13px;
  }

  .save-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: #fff;
    color: var(--blue);
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: transform 0.15s ease, background 0.15s ease;
    margin-bottom: 12px;
  }

  .save-btn:hover { transform: translateY(-1px); background: #f0f0f0; }
  .save-btn:active { transform: translateY(0); }

  .linkedin-links {
    display: flex;
    gap: 8px;
  }

  .li-btn {
    flex: 1;
    display: block;
    padding: 11px 8px;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .li-btn:hover { background: rgba(255,255,255,0.15); }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.04em;
  }

  .colour-strip {
    display: flex;
    height: 3px;
    border-radius: 0 0 24px 24px;
    overflow: hidden;
    margin-top: 28px;
  }

  .colour-strip span {
    flex: 1;
  }
</style>
</head>
